[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-eos-control-simulator"
version = "0.5.0"
description = "Fake Canon camera simulator for Open EOS Control"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "Pillow>=10.4,<13.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0"
]

[project.urls]
Homepage = "https://github.com/js051/open-eos-control"
Repository = "https://github.com/js051/open-eos-control"
Issues = "https://github.com/js051/open-eos-control/issues"

[tool.setuptools]
py-modules = ["main"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["main"]
