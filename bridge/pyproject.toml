[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-eos-control-bridge"
version = "0.1.1"
description = "Open EOS Control desktop camera bridge"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "av>=18.0.0,<19.0",
  "fastapi>=0.115.0,<1.0",
  "Pillow>=10.4,<13.0",
  "pydantic>=2.8.0,<3.0",
  "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0",
  "pytest>=8.3.0,<9.0",
  "ruff>=0.6.0",
]

[project.scripts]
open-eos-bridge = "open_eos_bridge.main:run"

[project.urls]
Homepage = "https://github.com/js051/open-eos-control"
Repository = "https://github.com/js051/open-eos-control"
Issues = "https://github.com/js051/open-eos-control/issues"

[tool.setuptools.packages.find]
include = ["open_eos_bridge*"]

[tool.setuptools.package-data]
open_eos_bridge = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
