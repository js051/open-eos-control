[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-eos-control-bridge"
version = "0.1.0"
description = "Open EOS Control desktop camera bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "pydantic>=2.8.0,<3.0",
  "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0",
  "pytest>=8.3.0,<9.0",
  "ruff>=0.6.0",
]

[project.scripts]
open-eos-bridge = "open_eos_bridge.main:run"

[tool.setuptools.packages.find]
include = ["open_eos_bridge*"]

[tool.setuptools.package-data]
open_eos_bridge = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
