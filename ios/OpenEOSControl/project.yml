name: OpenEOSControl
options:
  bundleIdPrefix: dev.openeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OpenEOSCore:
    path: ../OpenEOSCore
targets:
  OpenEOSControl:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: OpenEOSCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.openeos.control
        PRODUCT_NAME: OpenEOSControl
        MARKETING_VERSION: 0.13.0
        CURRENT_PROJECT_VERSION: 27
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  OpenEOSControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
      # External files must stay relative to this project, without shared ancestor groups.
      - path: ../../contracts/media-delivery/v1/outcome-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/live-view-lut/v1/numeric-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/media-date-review/v1/date-review-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/capture-review-evidence/v1/review-evidence-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/media-mutation/v1/media-mutation-eligibility-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/media-mutation/v1/media-mutation-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/media-type/v1/media-type-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../../contracts/jpeg-original/v1/jpeg-original-vectors.json
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../OpenEOSCore/Tests/OpenEOSCoreTests/URLSessionPendingBulbStopTests.swift
        createIntermediateGroups: false
    dependencies:
      - target: OpenEOSControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openeos.control.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10
  OpenEOSControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Tests/Fixtures/valid-h264-baseline.mp4
        buildPhase: resources
    dependencies:
      - target: OpenEOSControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openeos.control.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10
schemes:
  OpenEOSControl:
    build:
      targets:
        OpenEOSControl: all
        OpenEOSControlTests: [test]
        OpenEOSControlUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OpenEOSControlTests
        - OpenEOSControlUITests
