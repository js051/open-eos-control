name: Release development preview

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-published:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag, versions, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify-version.py --tag "$GITHUB_REF_NAME"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify main acceptance provenance
        id: acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/provenance.py run \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --workflow main.yml \
            --event push \
            --output "$GITHUB_OUTPUT"

      - name: Download promoted release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.workflow_run_id }}

      - name: Verify promoted packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release/release_candidate.py verify \
            --directory dist \
            --version "$version" \
            --commit "$GITHUB_SHA"
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          title="Open EOS Control ${GITHUB_REF_NAME#v} Development Preview"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi
