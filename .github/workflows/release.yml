name: Release development preview

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and product versions
        run: python3 scripts/release/verify-version.py --tag "$GITHUB_REF_NAME"

      - name: Test physical-camera evidence verifier
        run: python3 -m unittest discover -s scripts/validation/tests -p "test_*.py"

      - name: Require a release commit from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --timeout 300

  android:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Test and lint Android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Prepare stable Android signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEVELOPMENT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/open-eos-control-development-v1.p12"
          chmod 600 "$RUNNER_TEMP/open-eos-control-development-v1.p12"

      - name: Build stable-signed Android debug APK
        env:
          OEC_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/open-eos-control-development-v1.p12
          OEC_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
          OEC_ANDROID_SIGNING_KEY_ALIAS: open-eos-control-development-v1
          OEC_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Verify stable Android signer
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          signer_output="$($apksigner verify --print-certs "$apk")"
          test "$(grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' <<< "$signer_output")" -eq 1
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signer_output" | tr '[:upper:]' '[:lower:]')"
          expected="$(tr -d '[:space:]' < signing/development-certificate-sha256.txt)"
          test "$actual" = "$expected"

      - name: Stage Android package
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "../dist/open-eos-control-android-${GITHUB_REF_NAME#v}-debug.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/open-eos-control-android-*-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-ui:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on Pixel API 34
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

  desktop-bridge:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install build and test dependencies
        run: |
          python -m pip install build==1.5.0 -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint and test Desktop Bridge
        run: |
          ruff check --no-cache . ../scripts/validation
          pytest -q -p no:cacheprovider
          node --check open_eos_bridge/static/icons.js
          node --check open_eos_bridge/static/diagnostics.js
          node --check open_eos_bridge/static/monitoring.js
          node --check open_eos_bridge/static/local-video.js
          node --check open_eos_bridge/static/media-transfer.js
          node --check open_eos_bridge/static/app.js
          npm run test:modules
          npm run test:browser

      - name: Build Desktop Bridge packages
        run: python -m build --outdir ../dist

      - name: Upload Desktop Bridge packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-bridge
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install standalone bundle dependencies
        run: python -m pip install -e ".[bundle]"

      - name: Build Windows standalone Desktop Bridge
        run: python scripts/build_standalone.py --output-dir ../dist --work-dir build/standalone

      - name: Launch and verify Windows standalone Desktop Bridge
        shell: pwsh
        run: |
          $artifact = Get-ChildItem ../dist/open-eos-control-bridge-windows-x64-*.exe |
            Select-Object -First 1
          if (-not $artifact) {
            throw "Windows standalone Desktop Bridge artifact was not created."
          }
          python scripts/verify_standalone.py $artifact.FullName
          & $artifact.FullName --version

      - name: Upload Windows standalone Desktop Bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-windows
          path: dist/open-eos-control-bridge-windows-x64-*.exe
          if-no-files-found: error
          retention-days: 14

  simulator:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: simulator

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install simulator and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint and test simulator
        run: |
          ruff check --no-cache .
          pytest -q -p no:cacheprovider

  ios:
    needs: release-gate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test iOS core
        run: swift test --package-path ios/OpenEOSCore

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate and build iOS app
        working-directory: ios/OpenEOSControl
        run: |
          xcodegen generate
          xcodebuild \
            -project OpenEOSControl.xcodeproj \
            -scheme OpenEOSControl \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select iPhone simulator
        id: simulator
        working-directory: ios/OpenEOSControl
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime, values in data["devices"].items() if ".iOS-" in runtime for device in values if device["name"].startswith("iPhone") and device.get("isAvailable", False)]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Test iOS app and UI
        working-directory: ios/OpenEOSControl
        run: |
          xcodebuild \
            -project OpenEOSControl.xcodeproj \
            -scheme OpenEOSControl \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            test

  publish:
    needs:
      - android
      - android-ui
      - desktop-bridge
      - desktop-windows
      - simulator
      - ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/open-eos-control-android-$version-debug.apk"
          test -f "dist/open-eos-control-bridge-windows-x64-$version.exe"
          test -f "dist/open_eos_control_bridge-$version-py3-none-any.whl"
          test -f "dist/open_eos_control_bridge-$version.tar.gz"
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          title="Open EOS Control ${GITHUB_REF_NAME#v} Development Preview"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi
