name: Main acceptance

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  main-accepted:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify pull-request CI provenance
        id: provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/provenance.py promote \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --workflow android.yml \
            --base main \
            --output "$GITHUB_OUTPUT"

      - name: Determine whether this merge changes the product version
        id: release-scope
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(python3 scripts/release/verify-version.py)"
          previous_version="$(
            git show "$GITHUB_SHA^:bridge/pyproject.toml" \
              | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          )"
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "candidate_required=false" >> "$GITHUB_OUTPUT"
            echo "Accepted non-version merge at $GITHUB_SHA; no release candidate is required."
          else
            echo "candidate_required=true" >> "$GITHUB_OUTPUT"
            echo "Accepted version change $previous_version -> $current_version."
          fi

      - name: Download tested release candidates
        if: steps.release-scope.outputs.candidate_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.workflow_run_id }}

      - name: Set up JDK
        if: steps.release-scope.outputs.candidate_required == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.release-scope.outputs.candidate_required == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        if: steps.release-scope.outputs.candidate_required == 'true'
        working-directory: android
        run: chmod +x gradlew

      - name: Prepare stable Android signing keystore
        if: steps.release-scope.outputs.candidate_required == 'true'
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEVELOPMENT_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/open-eos-control-development-v1.p12"
          chmod 600 "$RUNNER_TEMP/open-eos-control-development-v1.p12"

      - name: Build stable-signed Android debug APK
        if: steps.release-scope.outputs.candidate_required == 'true'
        working-directory: android
        env:
          OEC_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/open-eos-control-development-v1.p12
          OEC_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
          OEC_ANDROID_SIGNING_KEY_ALIAS: open-eos-control-development-v1
          OEC_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Verify stable Android signer
        if: steps.release-scope.outputs.candidate_required == 'true'
        shell: bash
        run: bash scripts/release/verify-android-apk-signing.sh android/app/build/outputs/apk/debug/app-debug.apk android/signing/development-certificate-sha256.txt

      - name: Read product version
        if: steps.release-scope.outputs.candidate_required == 'true'
        id: version
        shell: bash
        run: echo "version=$(python3 scripts/release/verify-version.py)" >> "$GITHUB_OUTPUT"

      - name: Assemble immutable release candidate
        if: steps.release-scope.outputs.candidate_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/open-eos-control-android-$version-debug.apk"
          python3 scripts/release/release_candidate.py create \
            --directory dist \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --pull-request "${{ steps.provenance.outputs.pull_request }}" \
            --pull-head "${{ steps.provenance.outputs.pull_head_sha }}" \
            --ci-run-id "${{ steps.provenance.outputs.workflow_run_id }}"
          python3 scripts/release/release_candidate.py verify \
            --directory dist \
            --version "$version" \
            --commit "$GITHUB_SHA"

      - name: Upload promoted release candidate
        if: steps.release-scope.outputs.candidate_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
