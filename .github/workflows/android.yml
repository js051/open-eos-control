name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install simulator and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint simulator
        run: ruff check --no-cache .

      - name: Test simulator contract
        run: pytest -q

  desktop-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint desktop bridge
        run: ruff check --no-cache .

      - name: Check desktop control scripts
        run: |
          node --check open_eos_bridge/static/icons.js
          node --check open_eos_bridge/static/app.js

      - name: Test desktop bridge contract
        run: pytest -q -p no:cacheprovider

  ios-core:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/OpenEOSCore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Test iOS CCAPI core
        run: swift test
