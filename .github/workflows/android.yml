name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --timeout 300

      - name: Verify product version consistency
        run: python3 scripts/release/verify-version.py

      - name: Validate GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  android-ui:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on Pixel API 34
        env:
          ANDROID_API_LEVEL: "34"
        run: bash ../scripts/ci/run-android-ui-tests.sh

      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ui-test-results
          path: |
            android/app/build/reports/androidTests/connected/debug
            android/app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: ignore
          retention-days: 7

  simulator:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install simulator and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint simulator
        run: ruff check --no-cache .

      - name: Test simulator contract
        run: pytest -q

  desktop-bridge:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bridge and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint desktop bridge
        run: ruff check --no-cache .

      - name: Check desktop control scripts
        run: |
          node --check open_eos_bridge/static/icons.js
          node --check open_eos_bridge/static/app.js

      - name: Test desktop bridge contract
        run: pytest -q -p no:cacheprovider

  ios-core:
    needs: secret-scan
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/OpenEOSCore

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift toolchain
        run: swift --version

      - name: Test iOS CCAPI core
        run: swift test

  ios-app:
    needs: secret-scan
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/OpenEOSControl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Validate app metadata
        run: |
          plutil -lint App/Info.plist
          xcodegen generate
          xcodebuild -project OpenEOSControl.xcodeproj -scheme OpenEOSControl -list

      - name: Build iOS app
        run: |
          xcodebuild \
            -project OpenEOSControl.xcodeproj \
            -scheme OpenEOSControl \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify bundled app resources
        run: |
          APP_PATH=".derived-data/Build/Products/Debug-iphonesimulator/OpenEOSControl.app"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/en.lproj/Localizable.strings"
          test -f "$APP_PATH/zh-Hant.lproj/Localizable.strings"
          plutil -extract UILaunchScreen xml1 -o /dev/null "$APP_PATH/Info.plist"
          test -n "$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$APP_PATH/Info.plist")"
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$APP_PATH/Info.plist")" = "true"
          ORIENTATIONS=$(plutil -extract UISupportedInterfaceOrientations xml1 -o - "$APP_PATH/Info.plist")
          grep -q UIInterfaceOrientationPortrait <<< "$ORIENTATIONS"
          grep -q UIInterfaceOrientationLandscapeLeft <<< "$ORIENTATIONS"
          grep -q UIInterfaceOrientationLandscapeRight <<< "$ORIENTATIONS"
          if grep -q UIInterfaceOrientationPortraitUpsideDown <<< "$ORIENTATIONS"; then
            echo "Whole-window upside-down orientation must remain disabled"
            exit 1
          fi

      - name: Select iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime, values in data["devices"].items() if ".iOS-" in runtime for device in values if device["name"].startswith("iPhone") and device.get("isAvailable", False)]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Test iOS app and UI
        run: |
          rm -rf TestResults.xcresult
          xcodebuild \
            -project OpenEOSControl.xcodeproj \
            -scheme OpenEOSControl \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath .derived-data \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: ios/OpenEOSControl/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
