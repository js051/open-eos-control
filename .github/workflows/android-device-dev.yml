# One-shot supplemental Android device validation; never substitutes for PR ci-complete.
# Only the next explicitly approved push may run the two original KVM-enabled emulator jobs.
name: Android device dev validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/android-device-dev.yml'

permissions:
  contents: read

concurrency:
  group: android-device-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    # This one-shot gate prevents future pushes or reruns from repeating KVM changes.
    if: github.event.before == '575eb20d006072a133bbb8df6f7f95b3975a6985' && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --timeout 300

      - name: Validate GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh

  instrumentation-compile:
    # Shared barrier: neither emulator job may change KVM access before all
    # instrumentation Kotlin and its production dependencies compile at this SHA.
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Compile all instrumentation Kotlin before either KVM operation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin -Pandroid.testInstrumentationRunnerArguments.requireSimulator=true \
            | tee "$RUNNER_TEMP/android-instrumentation-compile.log"

      - name: Upload instrumentation compilation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-compile
          path: ${{ runner.temp }}/android-instrumentation-compile.log
          if-no-files-found: ignore
          retention-days: 7

  android-ui:
    needs: instrumentation-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start fake camera for Android end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "../simulator"
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 18080 \
            > "$RUNNER_TEMP/android-camera-simulator.log" 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/android-camera-simulator.log"
          exit 1

      - name: Run UI tests on Pixel API 34
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireSimulator=true

      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ui-test-results
          path: |
            android/app/build/reports/androidTests/connected/debug
            android/app/build/outputs/androidTest-results/connected/debug
            android/app/build/outputs/connected_android_test_additional_output
            ${{ runner.temp }}/android-camera-simulator.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  android-ui-api36:
    needs: instrumentation-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start fake camera for Android 16 end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "../simulator"
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 18080 \
            > "$RUNNER_TEMP/android-camera-simulator-api36.log" 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/android-camera-simulator-api36.log"
          exit 1

      - name: Run UI tests on Pixel API 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireSimulator=true

      - name: Upload Android 16 UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ui-test-results-api36
          path: |
            android/app/build/reports/androidTests/connected/debug
            android/app/build/outputs/androidTest-results/connected/debug
            android/app/build/outputs/connected_android_test_additional_output
            ${{ runner.temp }}/android-camera-simulator-api36.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
